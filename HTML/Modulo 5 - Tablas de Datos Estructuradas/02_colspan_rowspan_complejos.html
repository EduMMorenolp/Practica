<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusión de Celdas con Colspan y Rowspan</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 10px 14px;
      text-align: center;
    }
    th {
      background: #090d16;
      color: #38bdf8;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 5 — Ejercicio 2</span>
    <h1>Fusión de Celdas Multidimensionales</h1>
    <p>Aprende a combinar columnas (<code>colspan</code>) y filas (<code>rowspan</code>) para construir matrices complejas como cronogramas o comparativas.</p>

    <!-- ========================================== -->
    <!-- RETO 2.1: HORARIO CON FUSIONES             -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del div #bloque-matriz:
         Crea una tabla con id="tabla-horario":
         Fila 1 (Encabezados):
           - <th>Día</th>
           - <th>Mañana</th>
           - <th>Tarde</th>
         Fila 2:
           - <th>Lunes</th>
           - <td colspan="2">Taller Completo de HTML</td>  (abarca mañana y tarde)
         Fila 3:
           - <th rowspan="2">Martes</th> (abarca dos filas de turnos)
           - <td>CSS Flexbox</td>
           - <td>CSS Grid</td>
         Fila 4:
           - <td>Práctica Libre</td>
           - <td>Evaluación</td>
    -->
    <div id="bloque-matriz">

    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 5 Ejercicio 2 ===');

      const tbl = document.getElementById('tabla-horario');

      registrarTest(
        'RETO 2.1 (Celda con colspan="2")',
        () => {
          const tdCol = tbl?.querySelector('td[colspan="2"]');
          return tdCol && tdCol.textContent.includes('Taller Completo de HTML');
        },
        'Debe existir un <td colspan="2"> con texto "Taller Completo de HTML"'
      );

      registrarTest(
        'RETO 2.1 (Encabezado con rowspan="2")',
        () => {
          const thRow = tbl?.querySelector('th[rowspan="2"]');
          return thRow && thRow.textContent.includes('Martes');
        },
        'Debe existir un <th rowspan="2"> con texto "Martes"'
      );

      registrarTest(
        'RETO 2.1 (Total de filas en la tabla)',
        () => {
          const trs = tbl ? tbl.querySelectorAll('tr') : [];
          return trs.length === 4;
        },
        'La tabla debe tener exactamente 4 filas <tr>'
      );
    });
  </script>
</body>
</html>
