<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesibilidad ARIA y Dialog Nativo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    dialog {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 20px;
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 10 — Ejercicio 2</span>
    <h1>Modal Nativo con &lt;dialog&gt; y Atributos ARIA</h1>
    <p>Aprende a crear ventanas modales accesibles y comunicar estados para lectores de pantalla con atributos ARIA.</p>

    <!-- ========================================== -->
    <!-- RETO 2.1: DIALOG NATIVO                    -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del div #bloque-dialog:
         1. Crea un modal <dialog id="modal-confirmacion">
              <h3>Confirmar Acción</h3>
              <p>¿Estás seguro de continuar?</p>
              <button id="btn-cerrar-modal" onclick="document.getElementById('modal-confirmacion').close()">Cerrar</button>
            </dialog>
         2. Un botón para abrirlo:
            <button id="btn-abrir-modal" onclick="document.getElementById('modal-confirmacion').showModal()">Abrir Modal</button>
    -->
    <div id="bloque-dialog">

    </div>

    <!-- ========================================== -->
    <!-- RETO 2.2: ACCESIBILIDAD ARIA               -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del div #bloque-aria:
         1. Crea un botón con id="btn-icono-buscar":
            - Atributo aria-label="Buscar en todo el sitio web"
            - Texto o icono interior: "🔍"
         2. Crea una alerta en vivo con id="notificacion-aria":
            - Atributo role="alert"
            - Atributo aria-live="polite"
            - Texto: "Datos guardados correctamente."
    -->
    <div id="bloque-aria">

    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 10 Ejercicio 2 ===');

      // RETO 2.1: dialog
      registrarTest(
        'RETO 2.1 (Elemento <dialog> y botón showModal)',
        () => {
          const dlg = document.getElementById('modal-confirmacion');
          const btn = document.getElementById('btn-abrir-modal');
          return dlg && dlg.tagName === 'DIALOG' &&
                 btn && btn.getAttribute('onclick')?.includes('showModal');
        },
        'Falta <dialog id="modal-confirmacion"> y <button id="btn-abrir-modal" onclick="...showModal()">'
      );

      // RETO 2.2: ARIA
      registrarTest(
        'RETO 2.2 (Botón accesible con aria-label)',
        () => {
          const btn = document.getElementById('btn-icono-buscar');
          return btn && btn.getAttribute('aria-label') === 'Buscar en todo el sitio web';
        },
        'Falta button#btn-icono-buscar con aria-label="Buscar en todo el sitio web"'
      );

      registrarTest(
        'RETO 2.2 (Alerta con role="alert" y aria-live)',
        () => {
          const alertBox = document.getElementById('notificacion-aria');
          return alertBox && alertBox.getAttribute('role') === 'alert' &&
                 alertBox.getAttribute('aria-live') === 'polite';
        },
        'Falta div#notificacion-aria con role="alert" y aria-live="polite"'
      );
    });
  </script>
</body>
</html>
