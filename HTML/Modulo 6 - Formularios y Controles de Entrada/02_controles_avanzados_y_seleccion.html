<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controles Avanzados, Selección y Subida de Archivos</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }
    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input, select, textarea {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #090d16;
      color: #f8fafc;
      font-size: 0.95rem;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 6 — Ejercicio 2</span>
    <h1>Selectores Agrupados (optgroup), Fechas y Subida de Archivos</h1>
    <p>Aprende a capturar archivos mediante <code>enctype="multipart/form-data"</code> y a organizar menús de selección.</p>

    <!-- ========================================== -->
    <!-- RETO 2.1: CONTROLES AVANZADOS Y ARCHIVOS   -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del div #bloque-avanzado:
         Crea un <form id="form-perfil" action="/api/perfil" method="POST" enctype="multipart/form-data">

           1. Menú desplegable con grupos (<select id="pais" name="pais"):
              - <optgroup label="América del Sur">
                  <option value="ar">Argentina</option>
                  <option value="cl">Chile</option>
              - <optgroup label="Europa">
                  <option value="es">España</option>

           2. Selector de fecha de nacimiento:
              - <label for="fecha">Fecha de Nacimiento:</label>
              - <input type="date" id="fecha" name="fecha" min="1950-01-01">

           3. Subida de archivo (Avatar):
              - <label for="avatar">Foto de perfil (solo imágenes):</label>
              - <input type="file" id="avatar" name="avatar" accept="image/*">

           4. Campo de texto multilínea:
              - <label for="bio">Biografía:</label>
              - <textarea id="bio" name="bio" rows="4"></textarea>
         </form>
    -->
    <div id="bloque-avanzado">

    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 6 Ejercicio 2 ===');

      const form = document.getElementById('form-perfil');

      registrarTest(
        'RETO 2.1 (Form con enctype multipart/form-data)',
        () => form && form.enctype === 'multipart/form-data',
        'El formulario debe tener enctype="multipart/form-data"'
      );

      registrarTest(
        'RETO 2.1 (Select con optgroups)',
        () => {
          const sel = form?.querySelector('select#pais');
          const groups = sel ? sel.querySelectorAll('optgroup') : [];
          return groups.length === 2 && sel.querySelectorAll('option').length === 3;
        },
        'Falta select#pais con 2 <optgroup> ("América del Sur" y "Europa") y sus opciones'
      );

      registrarTest(
        'RETO 2.1 (Input type="file" con accept="image/*")',
        () => {
          const inp = form?.querySelector('input#avatar[type="file"]');
          return inp && inp.getAttribute('accept') === 'image/*';
        },
        'Falta <input type="file" id="avatar" accept="image/*">'
      );

      registrarTest(
        'RETO 2.1 (Textarea bio)',
        () => {
          const txt = form?.querySelector('textarea#bio');
          return txt && txt.getAttribute('rows') === '4';
        },
        'Falta <textarea id="bio" rows="4"></textarea>'
      );
    });
  </script>
</body>
</html>
