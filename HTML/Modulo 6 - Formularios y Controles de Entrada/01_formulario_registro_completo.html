<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro y Validación Nativa</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }
    fieldset {
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 8px;
    }
    legend {
      color: #38bdf8;
      font-weight: bold;
      padding: 0 8px;
    }
    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    input, button {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #090d16;
      color: #f8fafc;
      font-size: 0.95rem;
    }
    button[type="submit"] {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: fit-content;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 6 — Ejercicio 1</span>
    <h1>Formulario de Registro con Validación Nativa HTML5</h1>
    <p>Construye un formulario accesible agrupado con fieldset y validación estricta sin JavaScript.</p>

    <!-- ========================================== -->
    <!-- RETO 1.1: FORMULARIO ACCESIBLE             -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del div #bloque-formulario:
         Crea un <form id="form-registro" action="/api/usuarios" method="POST">
           <fieldset>
             <legend>Datos de la Cuenta</legend>

             1. Campo Usuario:
                - <label for="usuario">Nombre de Usuario:</label>
                - <input type="text" id="usuario" name="usuario" required minlength="3">

             2. Campo Correo:
                - <label for="correo">Correo Electrónico:</label>
                - <input type="email" id="correo" name="correo" required>

             3. Campo Contraseña:
                - <label for="password">Contraseña:</label>
                - <input type="password" id="password" name="password" required minlength="6">

             4. Campo Términos y Condiciones:
                - <label for="terminos">Acepto los términos</label>
                - <input type="checkbox" id="terminos" name="terminos" required>

             5. Botón de envío:
                - <button type="submit">Crear Cuenta</button>
           </fieldset>
         </form>
    -->
    <div id="bloque-formulario">

    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 6 Ejercicio 1 ===');

      const form = document.getElementById('form-registro');

      registrarTest(
        'RETO 1.1 (Formulario con action y POST)',
        () => form && form.getAttribute('action') === '/api/usuarios' && form.getAttribute('method')?.toUpperCase() === 'POST',
        'Falta <form id="form-registro" action="/api/usuarios" method="POST">'
      );

      registrarTest(
        'RETO 1.1 (Fieldset y Legend)',
        () => {
          const fs = form?.querySelector('fieldset');
          const lg = fs?.querySelector('legend');
          return fs && lg && lg.textContent.trim() === 'Datos de la Cuenta';
        },
        'El formulario debe contener un <fieldset> con <legend>Datos de la Cuenta</legend>'
      );

      registrarTest(
        'RETO 1.1 (Input usuario con minlength="3" y required)',
        () => {
          const inp = form?.querySelector('input#usuario[type="text"]');
          const lbl = form?.querySelector('label[for="usuario"]');
          return inp && lbl && inp.required && inp.getAttribute('minlength') === '3';
        },
        'Falta input#usuario de tipo text con required y minlength="3" asociado a su label'
      );

      registrarTest(
        'RETO 1.1 (Input correo de tipo email)',
        () => {
          const inp = form?.querySelector('input#correo[type="email"]');
          return inp && inp.required;
        },
        'Falta input#correo con type="email" y required'
      );

      registrarTest(
        'RETO 1.1 (Checkbox términos y submit button)',
        () => {
          const chk = form?.querySelector('input#terminos[type="checkbox"]');
          const btn = form?.querySelector('button[type="submit"]');
          return chk && chk.required && btn && btn.textContent.trim() === 'Crear Cuenta';
        },
        'Falta el checkbox requerido #terminos y el botón <button type="submit">Crear Cuenta</button>'
      );
    });
  </script>
</body>
</html>
