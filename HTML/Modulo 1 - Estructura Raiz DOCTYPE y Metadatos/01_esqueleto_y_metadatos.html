<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ========================================== -->
  <!-- RETO 1.1: METADATOS ESENCIALES             -->
  <!-- ========================================== -->
  <!-- TODO: 
       1. Agrega la etiqueta meta para la codificación universal UTF-8:
          <meta charset="UTF-8">
       2. Agrega la etiqueta meta para el viewport responsivo:
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
       3. Agrega el título de la página con el texto exacto: "Practice Hub - HTML5"
          <title>Practice Hub - HTML5</title>
  -->


  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 1</span>
    <h1>Esqueleto y Metadatos en HTML5</h1>
    <p>Abre este archivo en tu navegador (o usa el botón <strong>"↗️ Abrir en Navegador"</strong> en el Practice Hub) para ver los resultados en vivo.</p>

    <!-- ========================================== -->
    <!-- RETO 1.2: CUERPO VISIBLE                   -->
    <!-- ========================================== -->
    <!-- TODO:
         Crea dentro de este contenedor:
         1. Un encabezado principal <h1> con id="titulo-pagina" y texto "Mi Primer Documento HTML"
         2. Un párrafo <p> con clase "lead" y texto "Aprendiendo la estructura raíz de la web."
    -->
    <div id="mi-contenido">

    </div>
  </div>

  <!-- Panel de validación en tiempo real -->
  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 1 Ejercicio 1 ===');

      // Comprobación RETO 1.1: DOCTYPE y atributos raíz
      registrarTest(
        'RETO 1.1 (Idioma raíz es)',
        () => document.documentElement.getAttribute('lang') === 'es',
        'El elemento <html> debe tener el atributo lang="es"'
      );

      registrarTest(
        'RETO 1.1 (Meta Charset UTF-8)',
        () => {
          const metaCharset = document.querySelector('meta[charset]');
          return metaCharset && metaCharset.getAttribute('charset').toUpperCase() === 'UTF-8';
        },
        'Falta <meta charset="UTF-8"> dentro de <head>'
      );

      registrarTest(
        'RETO 1.1 (Meta Viewport)',
        () => {
          const metaVp = document.querySelector('meta[name="viewport"]');
          return metaVp && metaVp.getAttribute('content').includes('width=device-width');
        },
        'Falta <meta name="viewport" content="width=device-width, initial-scale=1.0"> dentro de <head>'
      );

      registrarTest(
        'RETO 1.1 (Título de Página)',
        () => document.title.trim() === 'Practice Hub - HTML5',
        'Falta <title>Practice Hub - HTML5</title> dentro de <head>'
      );

      // Comprobación RETO 1.2: Elementos del Body
      registrarTest(
        'RETO 1.2 (H1 con ID)',
        () => {
          const h1 = document.getElementById('titulo-pagina');
          return h1 && h1.tagName === 'H1' && h1.textContent.trim() === 'Mi Primer Documento HTML';
        },
        'Debe existir un <h1 id="titulo-pagina">Mi Primer Documento HTML</h1> dentro de #mi-contenido'
      );

      registrarTest(
        'RETO 1.2 (Párrafo con Clase)',
        () => {
          const p = document.querySelector('#mi-contenido p.lead');
          return p && p.textContent.trim() === 'Aprendiendo la estructura raíz de la web.';
        },
        'Debe existir un <p class="lead"> con el texto "Aprendiendo la estructura raíz de la web."'
      );
    });
  </script>
</body>
</html>
