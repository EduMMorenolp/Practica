<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anclas y Menú de Navegación</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    nav a {
      display: inline-block;
      margin-right: 15px;
      color: #38bdf8;
      font-weight: 600;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 20px;
      background: #090d16;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #334155;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 3 — Ejercicio 2</span>
    <h1>Menú de Navegación y Salto Intra-Página</h1>
    <p>Las anclas con <code>href="#id"</code> permiten al usuario desplazarse de forma instantánea a partes concretas del documento.</p>

    <!-- ========================================== -->
    <!-- RETO 2.1: MENÚ DE NAVEGACIÓN Y ANCLAS      -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del nav #menu-principal:
         Crea 3 enlaces:
         1. <a href="#caracteristicas">Características</a>
         2. <a href="#precios">Precios</a>
         3. <a href="#contacto">Contacto</a>
    -->
    <nav id="menu-principal">

    </nav>

    <!-- ========================================== -->
    <!-- RETO 2.2: SECCIONES DE DESTINO             -->
    <!-- ========================================== -->
    <!-- TODO: Crea las tres secciones correspondientes con sus IDs exactos:
         1. <section id="caracteristicas"><h2>Características Clave</h2></section>
         2. <section id="precios"><h2>Planes y Precios</h2></section>
         3. <section id="contacto"><h2>Escríbenos</h2></section>
    -->
    <div id="contenedor-secciones">

    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 3 Ejercicio 2 ===');

      // RETO 2.1: Links del menú
      registrarTest(
        'RETO 2.1 (Enlaces de navegación con #id)',
        () => {
          const nav = document.getElementById('menu-principal');
          const a1 = nav?.querySelector('a[href="#caracteristicas"]');
          const a2 = nav?.querySelector('a[href="#precios"]');
          const a3 = nav?.querySelector('a[href="#contacto"]');
          return a1 && a2 && a3 &&
                 a1.textContent.trim() === 'Características' &&
                 a2.textContent.trim() === 'Precios' &&
                 a3.textContent.trim() === 'Contacto';
        },
        'Faltan los 3 enlaces dentro de #menu-principal apuntando a #caracteristicas, #precios y #contacto'
      );

      // RETO 2.2: Secciones con IDs
      registrarTest(
        'RETO 2.2 (Sección #caracteristicas)',
        () => {
          const sec = document.querySelector('#contenedor-secciones section#caracteristicas');
          return sec && sec.querySelector('h2')?.textContent.trim() === 'Características Clave';
        },
        'Falta <section id="caracteristicas"> con <h2>Características Clave</h2>'
      );

      registrarTest(
        'RETO 2.2 (Sección #precios)',
        () => {
          const sec = document.querySelector('#contenedor-secciones section#precios');
          return sec && sec.querySelector('h2')?.textContent.trim() === 'Planes y Precios';
        },
        'Falta <section id="precios"> con <h2>Planes y Precios</h2>'
      );

      registrarTest(
        'RETO 2.2 (Sección #contacto)',
        () => {
          const sec = document.querySelector('#contenedor-secciones section#contacto');
          return sec && sec.querySelector('h2')?.textContent.trim() === 'Escríbenos';
        },
        'Falta <section id="contacto"> con <h2>Escríbenos</h2>'
      );
    });
  </script>
</body>
</html>
