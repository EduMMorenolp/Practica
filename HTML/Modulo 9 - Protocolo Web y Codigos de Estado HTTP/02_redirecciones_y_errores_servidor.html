<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecciones y Errores de Servidor (3XX y 5XX)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 9 — Ejercicio 2</span>
    <h1>Redirección con Meta Refresh y Error 500</h1>
    <p>Aprende a indicar redirecciones automáticas en el cliente con metadatos y a estructurar mensajes de caída del servicio.</p>

    <!-- ========================================== -->
    <!-- RETO 2.1: REDIRECCIÓN META REFRESH (301)   -->
    <!-- ========================================== -->
    <!-- TODO: En una etiqueta <noscript id="redireccion-fallback">:
         Agrega un aviso explicando que la página fue movida permanentemente y un enlace hacia "/nuevo-sitio".
    -->
    <noscript id="redireccion-fallback">

    </noscript>

    <!-- ========================================== -->
    <!-- RETO 2.2: PÁGINA DE FALLO 500 SERVER ERROR -->
    <!-- ========================================== -->
    <!-- TODO: Dentro del div #bloque-500:
         Crea una sección <section id="pantalla-500">:
         1. <h1>500 - Error Interno del Servidor</h1>
         2. <p>Nuestros ingenieros ya están trabajando en solucionarlo.</p>
         3. Un botón <button onclick="location.reload()">Reintentar Carga</button>
    -->
    <div id="bloque-500">

    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 9 Ejercicio 2 ===');

      // RETO 2.1
      registrarTest(
        'RETO 2.1 (Elemento noscript con enlace)',
        () => {
          const ns = document.getElementById('redireccion-fallback');
          return Boolean(ns);
        },
        'Falta <noscript id="redireccion-fallback">'
      );

      // RETO 2.2
      registrarTest(
        'RETO 2.2 (Sección Error 500 con botón reload)',
        () => {
          const s = document.querySelector('#bloque-500 section#pantalla-500');
          const h1 = s?.querySelector('h1');
          const btn = s?.querySelector('button');
          return s && h1 && h1.textContent.includes('500') &&
                 btn && btn.getAttribute('onclick')?.includes('reload');
        },
        'Falta <section id="pantalla-500"> con <h1>500...</h1> y <button onclick="location.reload()">'
      );
    });
  </script>
</body>
</html>
