<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posicionamiento Relativo y Absoluto</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 1.1: PATRÓN RELATIVE + ABSOLUTE       */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Convierte a #tarjeta-producto en el ancla de posicionamiento:
          - position: relative;
          - padding: 24px;
          - background: #090d16;
          - border-radius: 8px;
       2. Coloca la insignia #badge-oferta en la esquina superior derecha:
          - position: absolute;
          - top: 12px;
          - right: 12px;
          - background: rgb(239, 68, 68);
          - padding: 4px 10px;
          - border-radius: 9999px;
          - font-size: 12px;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 6 — Ejercicio 1</span>
    <h1>El Patrón Relative + Absolute</h1>
    <p>Aprende a anclar insignias flotantes con precisión milimétrica usando un contenedor relativo.</p>

    <div id="sandbox-posicionamiento">
      <div id="tarjeta-producto" style="border: 1px solid #334155; max-width: 380px;">
        <span id="badge-oferta">OFERTA -50%</span>
        <h3>Curso de CSS3 Avanzado</h3>
        <p style="color: #94a3b8; margin: 8px 0;">Domina maquetado y estilos profesionales.</p>
        <strong style="color: #38bdf8;">$29.99 USD</strong>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 6 Ejercicio 1 CSS ===');

      // 1. #tarjeta-producto position: relative
      registrarTest(
        'RETO 1.1 (Contenedor ancla position: relative)',
        () => {
          const el = document.getElementById('tarjeta-producto');
          return window.getComputedStyle(el).position === 'relative';
        },
        'Aplica #tarjeta-producto { position: relative; }'
      );

      // 2. #badge-oferta position: absolute en esquina superior derecha
      registrarTest(
        'RETO 1.1 (Insignia position: absolute con top: 12px y right: 12px)',
        () => {
          const el = document.getElementById('badge-oferta');
          const cs = window.getComputedStyle(el);
          return cs.position === 'absolute' && cs.top === '12px' && cs.right === '12px';
        },
        'Aplica #badge-oferta { position: absolute; top: 12px; right: 12px; }'
      );
    });
  </script>
</body>
</html>
