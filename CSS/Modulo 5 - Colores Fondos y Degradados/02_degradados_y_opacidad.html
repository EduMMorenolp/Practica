<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Degradados Lineales y Radiales</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 2.1: LINEAR Y RADIAL GRADIENT         */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura el botón con degradado horizontal #btn-gradiente:
          - background: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234));
          - padding: 12px 28px;
          - border: none;
          - border-radius: 8px;
          - color: #ffffff;
       2. Configura la esfera con degradado radial #esfera-luz:
          - width: 100px;
          - height: 100px;
          - border-radius: 50%;
          - background: radial-gradient(circle, rgb(56, 189, 248), rgb(15, 23, 42));
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 5 — Ejercicio 2</span>
    <h1>Degradados Lineales y Radiales (CSS Gradients)</h1>
    <p>Aprende a construir fondos suaves sin imágenes externas usando funciones nativas de gradiente.</p>

    <div id="sandbox-degradados" style="display: flex; gap: 30px; align-items: center;">
      <button id="btn-gradiente" style="cursor: pointer; font-weight: bold;">
        Botón con Gradiente
      </button>

      <div id="esfera-luz" style="border: 1px solid #334155;"></div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 5 Ejercicio 2 CSS ===');

      // 1. #btn-gradiente linear-gradient
      registrarTest(
        'RETO 2.1 (linear-gradient horizontal)',
        () => {
          const el = document.getElementById('btn-gradiente');
          const bg = window.getComputedStyle(el).backgroundImage;
          return bg.includes('linear-gradient') && bg.includes('37, 99, 235');
        },
        'Aplica #btn-gradiente { background: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234)); }'
      );

      // 2. #esfera-luz radial-gradient
      registrarTest(
        'RETO 2.1 (radial-gradient circular)',
        () => {
          const el = document.getElementById('esfera-luz');
          const bg = window.getComputedStyle(el).backgroundImage;
          return bg.includes('radial-gradient') && bg.includes('56, 189, 248');
        },
        'Aplica #esfera-luz { background: radial-gradient(circle, rgb(56, 189, 248), rgb(15, 23, 42)); }'
      );
    });
  </script>
</body>
</html>
