<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fondos e Imágenes con Background-Size</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 1.1: FONDOS CON COVER Y POSICIONAMIENTO*/
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura el banner #hero-banner:
          - height: 180px;
          - background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%232563eb" width="100" height="100"/></svg>');
          - background-size: cover;
          - background-position: center center;
          - background-repeat: no-repeat;
          - border-radius: 8px;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 5 — Ejercicio 1</span>
    <h1>Fondos de Imagen con Cover y Centrado</h1>
    <p>Aprende a configurar banners hero que llenan todo el espacio sin deformarse usando <code>background-size: cover</code>.</p>

    <div id="sandbox-fondos">
      <div id="hero-banner" style="display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; border: 1px solid #334155;">
        Banner Hero con Fondo Cover
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 5 Ejercicio 1 CSS ===');

      // 1. #hero-banner
      registrarTest(
        'RETO 1.1 (background-size: cover y background-position: center)',
        () => {
          const el = document.getElementById('hero-banner');
          const cs = window.getComputedStyle(el);
          return cs.height === '180px' &&
                 cs.backgroundSize === 'cover' &&
                 cs.backgroundRepeat === 'no-repeat' &&
                 (cs.backgroundPosition.includes('50%') || cs.backgroundPosition.includes('center'));
        },
        'Aplica #hero-banner { height: 180px; background-size: cover; background-position: center; background-repeat: no-repeat; }'
      );
    });
  </script>
</body>
</html>
