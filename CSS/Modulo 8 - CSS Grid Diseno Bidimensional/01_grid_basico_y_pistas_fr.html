<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid: Columnas Fraccionales y Gap</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 1.1: GRID DE 3 COLUMNAS Y SPAN        */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura la cuadrícula #galeria-grid:
          - display: grid;
          - grid-template-columns: repeat(3, 1fr);
          - gap: 16px;
       2. Haz que la primera celda #item-destacado abarque 2 columnas:
          - grid-column: span 2;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 8 — Ejercicio 1</span>
    <h1>CSS Grid: Cuadrículas con Unidad FR y Expansión</h1>
    <p>Aprende a maquetar cuadrículas bidimensionales y a expandir celdas con <code>grid-column: span 2</code>.</p>

    <div id="sandbox-grid">
      <div id="galeria-grid">
        <div id="item-destacado" style="background: #2563eb; padding: 20px; border-radius: 6px;">Destacado (2 Columnas)</div>
        <div class="item-grid" style="background: #090d16; padding: 20px; border-radius: 6px; border: 1px solid #334155;">Celda 2</div>
        <div class="item-grid" style="background: #090d16; padding: 20px; border-radius: 6px; border: 1px solid #334155;">Celda 3</div>
        <div class="item-grid" style="background: #090d16; padding: 20px; border-radius: 6px; border: 1px solid #334155;">Celda 4</div>
        <div class="item-grid" style="background: #090d16; padding: 20px; border-radius: 6px; border: 1px solid #334155;">Celda 5</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 8 Ejercicio 1 CSS ===');

      // 1. #galeria-grid display: grid y 3 columnas
      registrarTest(
        'RETO 1.1 (display: grid con 3 columnas y gap: 16px)',
        () => {
          const el = document.getElementById('galeria-grid');
          const cs = window.getComputedStyle(el);
          const cols = cs.gridTemplateColumns.trim().split(/\s+/);
          return cs.display === 'grid' && cols.length === 3 && cs.gap === '16px';
        },
        'Aplica #galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }'
      );

      // 2. #item-destacado grid-column: span 2
      registrarTest(
        'RETO 1.1 (grid-column: span 2 en celda destacada)',
        () => {
          const el = document.getElementById('item-destacado');
          const cs = window.getComputedStyle(el);
          return cs.gridColumnStart.includes('span 2') || cs.gridColumnEnd.includes('span 2') || cs.gridColumn.includes('span 2');
        },
        'Aplica #item-destacado { grid-column: span 2; }'
      );
    });
  </script>
</body>
</html>
