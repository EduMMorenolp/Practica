<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyframes y Animaciones Continuas</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 2.1: ANIMACIÓN CON @KEYFRAMES         */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Define la animación @keyframes girar:
          - from { transform: rotate(0deg); }
          - to { transform: rotate(360deg); }
       2. Asigna la animación al spinner #spinner-carga:
          - width: 48px;
          - height: 48px;
          - border: 4px solid #334155;
          - border-top-color: rgb(56, 189, 248);
          - border-radius: 50%;
          - animation: girar 1s linear infinite;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 10 — Ejercicio 2</span>
    <h1>Animaciones Continuas con @keyframes</h1>
    <p>Aprende a definir fotogramas clave y a crear spinners de carga continuos en CSS.</p>

    <div id="sandbox-animacion" style="display: flex; align-items: center; gap: 20px;">
      <div id="spinner-carga"></div>
      <span style="color: #94a3b8;">Cargando datos del servidor...</span>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 10 Ejercicio 2 CSS ===');

      // 1. Regla @keyframes girar
      registrarTest(
        'RETO 2.1 (Definición de regla @keyframes)',
        () => {
          const sheets = Array.from(document.styleSheets);
          for (const s of sheets) {
            try {
              const rules = Array.from(s.cssRules || []);
              for (const r of rules) {
                if (r.type === CSSRule.KEYFRAMES_RULE || r.name === 'girar') {
                  return true;
                }
              }
            } catch (e) {}
          }
          return false;
        },
        'Define @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }'
      );

      // 2. #spinner-carga animation
      registrarTest(
        'RETO 2.1 (animation: girar 1s linear infinite y círculo)',
        () => {
          const el = document.getElementById('spinner-carga');
          const cs = window.getComputedStyle(el);
          return cs.animationName.includes('girar') &&
                 cs.animationIterationCount === 'infinite' &&
                 cs.borderRadius === '50%' &&
                 cs.borderTopColor.includes('56, 189, 248');
        },
        'Aplica #spinner-carga { width: 48px; height: 48px; border: 4px solid ...; border-radius: 50%; animation: girar 1s linear infinite; }'
      );
    });
  </script>
</body>
</html>
