<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transiciones y Transformaciones en CSS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 1.1: TRANSICIÓN Y TRANSFORM ESCALADO  */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura la transición suave sobre #tarjeta-animada:
          - transition: transform 0.3s ease, box-shadow 0.3s ease;
          - cursor: pointer;
       2. Agrega la transformación en estado :hover sobre #tarjeta-animada:
          - transform: translateY(-6px) scale(1.02);
          - box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 10 — Ejercicio 1</span>
    <h1>Transiciones Suaves y Transformaciones de Elevación</h1>
    <p>Aprende a animar propiedades con 60fps usando <code>transition</code> y <code>transform</code>.</p>

    <div id="sandbox-transicion">
      <div id="tarjeta-animada" style="background: #090d16; padding: 24px; border-radius: 8px; border: 1px solid #334155; max-width: 320px;">
        <h3 style="margin-top: 0; color: #38bdf8;">Tarjeta Interactiva</h3>
        <p style="color: #94a3b8; margin-bottom: 0;">Pasa el ratón por encima para experimentar la transición fluida.</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 10 Ejercicio 1 CSS ===');

      // 1. #tarjeta-animada transition declarada
      registrarTest(
        'RETO 1.1 (Propiedad transition declarada)',
        () => {
          const el = document.getElementById('tarjeta-animada');
          const cs = window.getComputedStyle(el);
          return cs.transitionDuration.includes('0.3s') || parseFloat(cs.transitionDuration) > 0;
        },
        'Aplica #tarjeta-animada { transition: transform 0.3s ease, box-shadow 0.3s ease; }'
      );

      // 2. Regla :hover con transform translateY o scale
      registrarTest(
        'RETO 1.1 (Regla #tarjeta-animada:hover con transform)',
        () => {
          const sheets = Array.from(document.styleSheets);
          for (const s of sheets) {
            try {
              const rules = Array.from(s.cssRules || []);
              for (const r of rules) {
                if (r.selectorText?.includes('#tarjeta-animada:hover') && r.style.transform) {
                  return true;
                }
              }
            } catch (e) {}
          }
          return false;
        },
        'Aplica #tarjeta-animada:hover { transform: translateY(-6px) scale(1.02); }'
      );
    });
  </script>
</body>
</html>
