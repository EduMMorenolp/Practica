<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox: Alineación y Distribución</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 1.1: NAVBAR Y CENTRADO CON FLEXBOX   */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura la barra #navbar-flex:
          - display: flex;
          - justify-content: space-between;
          - align-items: center;
          - padding: 12px 20px;
          - background: #090d16;
          - border-radius: 8px;
       2. Configura la caja de centrado perfecto #caja-centrado-flex:
          - height: 120px;
          - display: flex;
          - justify-content: center;
          - align-items: center;
          - gap: 16px;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 7 — Ejercicio 1</span>
    <h1>Flexbox: Barras de Navegación y Centrado Total</h1>
    <p>Aprende a distribuir elementos en los extremos con <code>space-between</code> y a centrar en ambos ejes.</p>

    <div id="sandbox-flex" style="display: flex; flex-direction: column; gap: 24px;">
      <!-- Barra de navegación -->
      <nav id="navbar-flex" style="border: 1px solid #334155;">
        <span style="font-weight: bold; color: #38bdf8;">Logo Brand</span>
        <div style="display: flex; gap: 12px;">
          <span>Inicio</span>
          <span>Proyectos</span>
          <span>Contacto</span>
        </div>
      </nav>

      <!-- Centrado perfecto -->
      <div id="caja-centrado-flex" style="background: #090d16; border: 1px dashed #475569; border-radius: 8px;">
        <button style="background: #2563eb; color: #fff; padding: 8px 16px; border: none; border-radius: 4px;">Acción 1</button>
        <button style="background: #334155; color: #fff; padding: 8px 16px; border: none; border-radius: 4px;">Acción 2</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 7 Ejercicio 1 CSS ===');

      // 1. #navbar-flex
      registrarTest(
        'RETO 1.1 (display: flex y justify-content: space-between)',
        () => {
          const el = document.getElementById('navbar-flex');
          const cs = window.getComputedStyle(el);
          return cs.display === 'flex' &&
                 cs.justifyContent === 'space-between' &&
                 cs.alignItems === 'center';
        },
        'Aplica #navbar-flex { display: flex; justify-content: space-between; align-items: center; }'
      );

      // 2. #caja-centrado-flex
      registrarTest(
        'RETO 1.1 (Centrado total en ambos ejes con gap: 16px)',
        () => {
          const el = document.getElementById('caja-centrado-flex');
          const cs = window.getComputedStyle(el);
          return cs.display === 'flex' &&
                 cs.justifyContent === 'center' &&
                 cs.alignItems === 'center' &&
                 cs.gap === '16px';
        },
        'Aplica #caja-centrado-flex { display: flex; justify-content: center; align-items: center; gap: 16px; }'
      );
    });
  </script>
</body>
</html>
