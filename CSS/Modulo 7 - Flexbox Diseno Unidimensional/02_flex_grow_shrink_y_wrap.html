<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex-Wrap, Flex-Grow y Distribución</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #10b981;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 2.1: FLEX-WRAP Y FLEX-GROW            */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura el contenedor multilínea #contenedor-envolvente:
          - display: flex;
          - flex-wrap: wrap;
          - gap: 12px;
       2. Configura los elementos hijos .item-tarjeta:
          - flex-grow: 1;
          - flex-basis: 180px;
          - padding: 16px;
          - background: #090d16;
          - border: 1px solid #334155;
          - border-radius: 6px;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 7 — Ejercicio 2</span>
    <h1>Diseño Envolvente con Flex-Wrap y Flex-Grow</h1>
    <p>Aprende a crear cuadrículas fluidas con Flexbox donde los elementos crecen y saltan de línea automáticamente.</p>

    <div id="sandbox-wrap">
      <div id="contenedor-envolvente">
        <div class="item-tarjeta">Tarjeta 1</div>
        <div class="item-tarjeta">Tarjeta 2</div>
        <div class="item-tarjeta">Tarjeta 3</div>
        <div class="item-tarjeta">Tarjeta 4</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 7 Ejercicio 2 CSS ===');

      // 1. #contenedor-envolvente flex-wrap: wrap
      registrarTest(
        'RETO 2.1 (flex-wrap: wrap y gap: 12px)',
        () => {
          const el = document.getElementById('contenedor-envolvente');
          const cs = window.getComputedStyle(el);
          return cs.display === 'flex' && cs.flexWrap === 'wrap' && cs.gap === '12px';
        },
        'Aplica #contenedor-envolvente { display: flex; flex-wrap: wrap; gap: 12px; }'
      );

      // 2. .item-tarjeta flex-grow: 1 y flex-basis: 180px
      registrarTest(
        'RETO 2.1 (flex-grow: 1 y flex-basis: 180px)',
        () => {
          const el = document.querySelector('.item-tarjeta');
          const cs = window.getComputedStyle(el);
          return cs.flexGrow === '1' && cs.flexBasis === '180px';
        },
        'Aplica .item-tarjeta { flex-grow: 1; flex-basis: 180px; }'
      );
    });
  </script>
</body>
</html>
