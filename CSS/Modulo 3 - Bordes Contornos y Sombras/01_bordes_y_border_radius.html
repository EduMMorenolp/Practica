<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bordes y Border-Radius en CSS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #suite-resultados {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
    }
    .test-pass { color: #4ade80; margin: 4px 0; }
    .test-fail { color: #f87171; margin: 4px 0; }

    /* ========================================== */
    /* RETO 1.1: BORDES Y FORMAS GEOMÉTRICAS      */
    /* ========================================== */
    /* TODO: Escribe tus reglas CSS a mano aquí abajo:
       1. Configura el avatar circular #avatar-usuario:
          - width: 80px;
          - height: 80px;
          - border-radius: 50%;
          - border: 3px solid rgb(56, 189, 248);
       2. Configura el botón píldora #btn-pildora:
          - padding: 8px 24px;
          - border-radius: 9999px;
          - border: 1px solid rgb(74, 222, 128);
       3. Configura la caja de alerta #alerta-info:
          - border-left: 6px solid rgb(234, 179, 8);
          - padding: 12px;
    */

  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Módulo 3 — Ejercicio 1</span>
    <h1>Bordes y Formas con Border-Radius</h1>
    <p>Aprende a crear avatares circulares, botones píldora y bordes direccionales destacados.</p>

    <div id="sandbox-bordes" style="display: flex; flex-direction: column; gap: 20px;">
      <div id="avatar-usuario" style="background: #090d16; display: flex; align-items: center; justify-content: center;">
        🧑
      </div>

      <div>
        <button id="btn-pildora" style="background: #090d16; color: #f8fafc; cursor: pointer;">
          Botón Píldora
        </button>
      </div>

      <div id="alerta-info" style="background: #090d16;">
        Aviso importante con borde izquierdo acentuado.
      </div>
    </div>
  </div>

  <div class="card">
    <h2>🧪 Suite de Validación Automática</h2>
    <div id="suite-resultados"></div>
  </div>

  <!-- ========================================== -->
  <!-- 🧪 SUITE DE VALIDACIÓN AUTOMÁTICA (no tocar) -->
  <!-- ========================================== -->
  <script>
    function registrarTest(nombre, condicion, pista) {
      const suite = document.getElementById('suite-resultados');
      let esValido = false;
      try {
        esValido = Boolean(typeof condicion === 'function' ? condicion() : condicion);
      } catch (e) {
        esValido = false;
      }

      const item = document.createElement('div');
      item.className = esValido ? 'test-pass' : 'test-fail';
      item.textContent = (esValido ? '✔ ' : '❌ ') + nombre + (esValido ? '' : ' ➔ ' + pista);
      suite.appendChild(item);
      console.log(item.textContent);
      return esValido;
    }

    window.addEventListener('DOMContentLoaded', () => {
      console.log('=== Comprobando Módulo 3 Ejercicio 1 CSS ===');

      // 1. #avatar-usuario
      registrarTest(
        'RETO 1.1 (Círculo con border-radius: 50% y border: 3px solid)',
        () => {
          const el = document.getElementById('avatar-usuario');
          const cs = window.getComputedStyle(el);
          return (cs.borderRadius === '50%' || cs.borderTopLeftRadius === '40px') &&
                 cs.borderTopWidth === '3px' &&
                 cs.borderTopColor.includes('56, 189, 248');
        },
        'Aplica #avatar-usuario { width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgb(56, 189, 248); }'
      );

      // 2. #btn-pildora
      registrarTest(
        'RETO 1.1 (Forma de píldora con border-radius)',
        () => {
          const el = document.getElementById('btn-pildora');
          const cs = window.getComputedStyle(el);
          const r = parseInt(cs.borderTopLeftRadius, 10);
          return r >= 15 && cs.borderTopColor.includes('74, 222, 128');
        },
        'Aplica #btn-pildora { border-radius: 9999px; border: 1px solid rgb(74, 222, 128); }'
      );

      // 3. #alerta-info
      registrarTest(
        'RETO 1.1 (border-left: 6px solid amarillo)',
        () => {
          const el = document.getElementById('alerta-info');
          const cs = window.getComputedStyle(el);
          return cs.borderLeftWidth === '6px' && cs.borderLeftColor.includes('234, 179, 8');
        },
        'Aplica #alerta-info { border-left: 6px solid rgb(234, 179, 8); }'
      );
    });
  </script>
</body>
</html>
